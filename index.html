<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12b886">
<title>메디링고</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>
:root{--g:#12b886;--gd:#0c8f68;--gl:#d3f9e8;--line:#e6ece9;--line2:#c8d2ce;--tx:#1f2a28;--mu:#5b6b68;--mu2:#8a9894;--red:#e03131;--redl:#ffe3e3;--org:#e8590c;--gold:#f4a518;--blue:#1c7ed6;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
.scr{display:none;flex:1;flex-direction:column;min-height:100vh;min-height:100dvh}
.scr.on{display:flex}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;gap:8px}
.streak{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--org);font-size:15px}
.today{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1}
.bar>i{display:block;height:100%;background:var(--g);border-radius:6px;transition:width .3s}
.chsel{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px}
.scroll{flex:1;overflow-y:auto;padding-bottom:90px}
.band{margin:14px 14px 6px;border-radius:16px;padding:12px 14px;color:#fff;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.band b{font-size:19px;font-weight:900;display:block}
.band small{font-size:12px;font-weight:700;opacity:.88}
.band button{border:2px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:12px;padding:8px 10px;font-weight:800;font-size:13px}
.path{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;gap:18px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff}
.node.lock{background:var(--line);box-shadow:0 7px 0 var(--line2);color:#aab6b2}
.node .ring{position:absolute;inset:-9px;pointer-events:none}
.node.cur{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tag{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:12px;padding:3px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.nlab{font-size:11px;font-weight:700;color:var(--mu2);margin-top:-12px;text-align:center;max-width:150px}
.chest{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;color:#b8860b}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu2);padding:4px 10px;border-radius:12px}
.nav button.on{color:var(--g);background:var(--gl)}
.nav svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .box{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-weight:900;font-size:16px;letter-spacing:.3px;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gd)}
.btn.gh{background:#fff;color:var(--g);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.red{background:var(--red);box-shadow:0 4px 0 #a51111}
.btn:disabled{background:var(--line);color:#aab6b2;box-shadow:0 4px 0 var(--line2)}
h2{font-size:21px;margin:6px 0 4px;font-weight:900}
.mu{color:var(--mu);font-size:14px;line-height:1.55}
.card{border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff}
.chip{display:inline-flex;flex-direction:column;align-items:center;border:2px solid var(--line);border-radius:10px;padding:4px 8px;margin:3px 3px 0 0;font-size:13px;font-weight:800}
.chip small{font-weight:600;color:var(--mu);font-size:11px}
.chip.P{border-color:#a5d8ff}.chip.R{border-color:#b2f2bb}.chip.S{border-color:#ffd8a8}.chip.W{border-color:#e5dbff}
.snd{border:2px solid var(--line);background:#fff;border-radius:12px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.snd svg{width:22px;height:22px}
.fig{width:100%;border-radius:12px;border:2px solid var(--line);background:#fff;margin:8px 0;max-height:260px;object-fit:contain}
.figcap{font-size:11px;color:var(--mu2);margin-top:-4px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:14px 16px 4px}
.qtop .x{border:none;background:none;font-size:26px;color:var(--mu2);padding:0 4px;line-height:1}
.qbody{flex:1;padding:8px 18px 180px;display:flex;flex-direction:column}
.qkind{align-self:flex-start;font-size:13px;font-weight:900;color:var(--g);letter-spacing:.3px;margin:6px 0 2px}
.qkind.hard{color:#c2255c}
.qprompt{font-size:21px;font-weight:900;margin:4px 0 10px;line-height:1.45;word-break:keep-all}
.big{font-size:26px;font-weight:900;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.opt.sel{border-color:#74c0fc;background:#e7f5ff;box-shadow:0 3px 0 #74c0fc}
.opt.ok{border-color:var(--g);background:var(--gl);box-shadow:0 3px 0 var(--g)}
.opt.no{border-color:var(--red);background:var(--redl);box-shadow:0 3px 0 var(--red)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--line);min-height:56px;word-break:keep-all}
.mt.sel{border-color:#74c0fc;background:#e7f5ff}
.mt.done{opacity:.25;pointer-events:none}
.mt.bad{border-color:var(--red);background:var(--redl)}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;font-weight:700;background:#f8faf9;outline:none}
.inp:focus{border-color:#74c0fc;background:#fff}
.ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:12px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:17px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.tile.used{visibility:hidden}
.hint{background:#fff9db;border:2px solid #ffe066;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;font-weight:600}
.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line);z-index:6}
.foot.ok{background:var(--gl);border-color:transparent}
.foot.no{background:var(--redl);border-color:transparent}
.foot .fb{display:none;margin-bottom:4px}
.foot.ok .fb,.foot.no .fb{display:block}
.fb b{font-size:19px;font-weight:900;display:block}
.foot.ok .fb b{color:var(--gd)}.foot.no .fb b{color:var(--red)}
.fb div{font-size:15px;margin-top:3px;line-height:1.5}
.foot.ok .btn{background:var(--g)}
.foot.no .btn{background:var(--red);box-shadow:0 4px 0 #a51111}
.newword{text-align:center;padding-top:6px}
.newword .badge{display:inline-block;background:#e5dbff;color:#5f3dc4;font-weight:900;font-size:13px;border-radius:10px;padding:3px 10px}
.res{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.stat{display:flex;gap:10px;margin:16px 0}
.stat div{border:2px solid var(--gold);border-radius:14px;padding:8px 14px;min-width:92px}
.stat b{display:block;font-size:22px}
.stat small{font-weight:800;font-size:12px;color:var(--mu)}
.goals{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.goal{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--line)}
.goal.sel{border-color:var(--g);background:var(--gl);box-shadow:0 3px 0 var(--g)}
.goal small{color:var(--mu);font-weight:600}
.pad{padding:10px 18px}
.row{display:flex;align-items:center;gap:10px}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);gap:8px}
.tg{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:1px 6px;margin-left:3px;background:#f1f3f5;color:var(--mu)}
.tg.m{background:#fff0f6;color:#c2255c}.tg.s{background:#fff4e6;color:#d9480f}.tg.p{background:#e7f5ff;color:#1864ab}.tg.c{background:#f3f0ff;color:#5f3dc4}.tg.k{background:#ebfbee;color:#2b8a3e}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1f2a28;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.mascot{width:96px;height:96px}
.peek{border-bottom:3px dotted #74c0fc;cursor:pointer;position:relative}
.pop{position:absolute;left:0;top:calc(100% + 8px);z-index:9;background:#fff;border:2px solid #74c0fc;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;color:var(--tx);white-space:normal;min-width:150px;max-width:260px;box-shadow:0 4px 12px rgba(0,0,0,.12);line-height:1.5;letter-spacing:0}
.pop small{display:block;font-weight:600;color:var(--mu);font-size:12px}
.nbadge{display:inline-block;align-self:flex-start;background:#e5dbff;color:#5f3dc4;font-weight:900;font-size:12px;border-radius:9px;padding:2px 9px;margin-right:6px}
.kbd{font-size:12px;color:var(--mu2);margin-top:6px}
</style>
</head>
<body>
<div id="app">

<!-- 목표 고르기 -->
<section class="scr" id="s-goal">
  <div class="pad" style="padding-top:28px">
    <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="38" fill="#12b886"/><rect x="40" y="10" width="20" height="22" rx="4" fill="#fff"/><rect x="47" y="13" width="6" height="16" fill="#e03131"/><rect x="42" y="18" width="16" height="6" fill="#e03131"/><circle cx="37" cy="52" r="8" fill="#fff"/><circle cx="63" cy="52" r="8" fill="#fff"/><circle cx="38" cy="53" r="4" fill="#1f2a28"/><circle cx="62" cy="53" r="4" fill="#1f2a28"/><path d="M38 70q12 9 24 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    <h2>하루 목표 시간을 골라요</h2>
    <p class="mu">하루에 1유닛(섹션 5개)을 풀어요. 고른 시간에 맞춰 섹션마다 나오는 문제 수가 달라지고, 푸는 속도를 재서 앱이 문제 수를 알아서 맞춰요.</p>
    <div class="goals" id="goalList"></div>
    <button class="btn" id="goalOk">계속</button>
  </div>
</section>

<!-- 학습 길 -->
<section class="scr" id="s-home">
  <div class="top">
    <div class="streak"><svg width="20" height="20" viewBox="0 0 24 24" fill="#e8590c" aria-hidden="true"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 1.5-5 3-6 0 2 1 3 2 3 0-4 1-6 1-9z"/></svg><span id="stk">0</span>일</div>
    <button class="chsel" id="chBtn"></button>
    <div class="today" style="flex:0 1 150px"><div class="bar"><i id="todayBar"></i></div><span id="todayTxt" style="font-weight:800;color:var(--gd)"></span></div>
  </div>
  <div class="scroll" id="pathWrap"></div>
</section>

<!-- 가이드북 -->
<section class="scr" id="s-guide">
  <div class="qtop"><button class="x" data-back aria-label="닫기">×</button><b style="font-size:17px">가이드북</b></div>
  <div class="pad scroll" id="guideBody"></div>
</section>

<!-- 문제 -->
<section class="scr" id="s-quiz">
  <div class="qtop"><button class="x" id="qExit" aria-label="그만하기">×</button><div class="bar" style="height:14px"><i id="qBar"></i></div><button class="snd" id="qSnd" aria-label="소리"></button></div>
  <div class="qbody" id="qBody"></div>
  <div class="foot" id="foot"><div class="fb" id="fb"></div><button class="btn" id="qMain" disabled>확인</button></div>
</section>

<!-- 결과 -->
<section class="scr" id="s-res">
  <div class="res" id="resBody"></div>
</section>

<!-- 결합형 외전 -->
<section class="scr" id="s-forms">
  <div class="top"><b style="font-size:18px">결합형 외전</b><button class="chsel" id="chBtn2"></button></div>
  <div class="pad scroll" id="formsBody"></div>
</section>

<!-- 오답노트 -->
<section class="scr" id="s-notes">
  <div class="top"><b style="font-size:18px">오답노트</b></div>
  <div class="pad scroll" id="notesBody"></div>
</section>

<!-- 설정 -->
<section class="scr" id="s-set">
  <div class="top"><b style="font-size:18px">설정</b></div>
  <div class="pad scroll" id="setBody"></div>
</section>

<nav class="nav" id="nav">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>학습</button>
  <button data-tab="forms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="7" height="10" rx="2"/><rect x="14" y="7" width="7" height="10" rx="2"/><path d="M10 12h4"/></svg>결합형</button>
  <button data-tab="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>오답노트</button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>

<div class="sheet" id="sheet"><div class="box" id="sheetBox"></div></div>

    let sel = null;

    const inp = $("#tIn");

      Q.tries++;
      if (Q.tries === 1 && !(Q.meta.level === 6 && (S.ulv[Q.meta.u] || 2) === 3)) { // 1차: 힌트 주고 다시 기회
        let h = r.other ? `그건 <b>${esc(r.other.en)}</b> = <b>${esc(r.other.ko)}</b>이에요. 다시 생각해 봐요.` : r.near ? "거의 맞았어요! 철자 하나만 다시 봐요." : "";

  } else if (q.ui === "tiles") {

    Q.onMain = () => { };
  }
  const READ = ["en2ko", "en2koC", "piece", "pieceSplit", "typeKo"];
  if (q.auto && q.say) setTimeout(() => speak(q.say), 250);

}
function hintFor(q) {
  const t = q.t;
  if (q.lang === "ko") return `힌트: 첫 글자는 '${esc(t.ko[0])}'${t.ko.length > 2 ? `, ${t.ko.length}글자` : ""}${t.pc.length ? ` · ${t.pc.map(p => esc(p[2])).join(" + ")}` : ""}`;
  const w = t.en.replace(/\s*\(.*?\)/g, "");
  return `힌트: <b style="font-family:monospace;letter-spacing:2px">${esc(w.split(" ").map(x => x.slice(0, 2) + "·".repeat(Math.max(0, x.length - 2))).join(" "))}</b>${t.pc.length ? ` · ${t.pc.map(p => esc(p[0])).join(" + ")}` : ""}`;
}
function markWeak(t, k) {
  if (!t) return;
  const w = S.weak[t.id] = S.weak[t.id] || { m: 0, s: 0, p: 0, c: 0, k: 0, ok: 0 };
  w[k] = (w[k] || 0) + 1; w.ok = 0; w.last = today();
}
function markRight(t) {
  const w = S.weak[t.id]; if (!w) return;
  w.ok = (w.ok || 0) + 1;
  if (w.ok >= 3) delete S.weak[t.id];
}
function result(q, ok, note, silentMatch) {
  if (Q.locked) return; Q.locked = true;
  const sec = (Date.now() - Q.qt) / 1000;
  if (!silentMatch) logTime(sec); else logTime(Math.min(sec / 3, 60));
  const t = q.t;
  if (t) S.seen[t.id] = true;
  if (!q.again) { if (ok) Q.right++; else Q.wrong++ }
  if (ok) { sfx("ok"); if (t && q.ui !== "match") markRight(t) }
  else {
    sfx("no"); try { navigator.vibrate && navigator.vibrate(60) } catch (e) { }
    if (t && q.ui !== "match") markWeak(t, q.weak || "m");
    if (!q.again) { const again = Object.assign({}, q, { again: true }); if (again.ui === "mc") again.opts = shuffle(again.opts); Q.list.push(again) }
  }
  const ansLine = q.form ? `<div><b>${esc(q.form.f)}</b> = ${esc(q.form.ko)}</div>` : t && q.ui !== "match" ? `<div>${q.kind === "piece" ? `<b>${esc(q.piece[0])}</b> = ${esc(q.piece[2])}${q.piece[3] ? ` (쉬운 말: ${esc(q.piece[3])})` : ""}<br>` : ""}<b>${esc(t.en)}</b> = ${esc(t.kfull)}${t.pc.length ? `<br><span style="font-size:13px">${pcLine(t)}</span>` : ""}</div>` : "";
  foot(ok ? "ok" : "no", `<b>${ok ? pick(["좋아요!", "정답이에요!", "잘했어요!", "맞아요!"]) : "아쉬워요"}</b>${ansLine}${note ? `<div>${note}</div>` : ""}`, "계속");
  $("#qMain").disabled = false;
  if (t && q.ui !== "match" && !ok) speak(t.en);
  Q.onMain = () => { Q.i++; renderQ() };
  save();
}
$("#qMain").onclick = () => { if (!$("#qMain").disabled && Q && Q.onMain) Q.onMain() };
$("#qExit").onclick = () => { sheet(`<h2>그만할까요?</h2><p class="mu">지금 그만두면 이 섹션의 진행은 저장되지 않아요.</p><button class="btn" id="stay">계속 풀기</button><button class="btn gh" id="leave" style="color:var(--red)">그만하기</button>`); $("#stay").onclick = closeSheet; $("#leave").onclick = () => { closeSheet(); try { speechSynthesis.cancel() } catch (e) { } renderHome(); show("home") } };
$("#qSnd").onclick = () => { S.sound = !S.sound; save(); $("#qSnd").innerHTML = S.sound ? SND_ICON : SND_OFF; if (S.sound) { ac(); sfx("ok") } else try { speechSynthesis.cancel() } catch (e) { } };

function finish() {
  const m = Q.meta; const total = Q.right + Q.wrong;
  const acc = total ? Math.round(Q.right / total * 100) : 100;
  const mins = Math.max(1, Math.round((Date.now() - Q.t0) / 60000));
  touchDay(); bumpStreak();
  let title = "섹션 완료!", sub = "";
  if (m.type === "sec") {
    const before = secDone(m.u);
    if (m.level > before && m.level <= 5) S.sec[m.u] = m.level;
    S.day.secs++;
    const L = LEVELS[m.level - 1];
    title = `섹션 ${Math.min(m.level, 5)} · ${L.name} 완료!`;
    if (m.level === 6) {
      const old = S.ulv[m.u] || 2; let nt = old;
      if (acc >= 90 && old < 3) nt = old + 1; else if (acc < 70 && old > 1) nt = old - 1;
      S.ulv[m.u] = nt; S.uacc[m.u] = acc;
      title = `도전 완료 · 난이도 ${TIER_NAME[old]}`;
      sub = nt > old ? `잘했어요! 다음엔 '${TIER_NAME[nt]}'으로 올라가요.` : nt < old ? `다음엔 '${TIER_NAME[nt]}'으로 조금 쉽게 풀어요.` : `다음에도 '${TIER_NAME[nt]}'으로 풀어요. (90% 이상이면 올라가요)`;
    } else
    sub = S.sec[m.u] >= 5 && before < 5 ? "유닛을 끝냈어요! 다음 유닛이 열렸어요." : S.day.secs === 5 ? "오늘 목표(1유닛) 달성!" : `오늘 섹션 ${Math.min(5, S.day.secs)}/5`;
  } else if (m.type === "chest") { S.chest[m.key] = true; title = "복습 보물상자 열기 완료!" }
  else if (m.type === "trophy") { S.trophy[m.key] = true; title = "마무리 시험 통과!" }
  else if (m.type === "chrev") { S.chrev[m.key] = true; title = "챕터 총정리 완료!" }
  else if (m.type === "weak") { title = "약한 단어 연습 완료!" }
  else if (m.type === "forms") { S.formsDone[m.key] = true; title = "결합형 연습 완료!" }
  S.xp = (S.xp || 0) + total;
  save(); sfx("done");
  const qn = dailyQn();
  $("#resBody").innerHTML = `<svg class="mascot" viewBox="0 0 100 100"><circle cx="50" cy="54" r="38" fill="#12b886"/><rect x="40" y="10" width="20" height="22" rx="4" fill="#fff"/><rect x="47" y="13" width="6" height="16" fill="#e03131"/><rect x="42" y="18" width="16" height="6" fill="#e03131"/><path d="M30 50q7-8 14 0M56 50q7-8 14 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M36 66q14 12 28 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    <h2 style="color:var(--gd)">${title}</h2><p class="mu">${sub}</p>
    <div class="stat"><div><small>정확도</small><b>${acc}%</b></div><div><small>시간</small><b>${mins}분</b></div><div><small>연속</small><b>${streakNow()}일</b></div></div>
    <p class="mu" style="font-size:12px">평균 ${avgSec().toFixed(0)}초/문제 → 내일은 섹션당 약 ${targetQn()}문제 (지금 ${qn}문제)</p>
    <button class="btn" id="resOk" style="max-width:420px">계속</button>`;
  show("res");
  $("#resOk").onclick = () => {
    if (m.type === "sec" && m.level < 6 && S.day.secs < 5 && secDone(m.u) < 5) { startSection(m.u, secDone(m.u) + 1); return }
    if (m.type === "forms") { renderForms(); show("forms"); return }
    if (m.type === "weak") { renderNotes(); show("notes"); return }
    renderHome(); show("home");
  };
}

/* ---------------- 결합형 외전 ---------------- */

  let h = `<p class="mu">정규 길과 따로, 단어를 만드는 조각(접두사·어근·접미사)을 모아 연습해요. 쪼개기 섹션이 쉬워져요.</p>`;
  sets.forEach((s, i) => {
    const key = c.no + "_" + i;
    h += `<div class="card"><div class="row" style="justify-content:space-between"><b>외전 ${i + 1} ${S.formsDone[key] ? '<span class="tg k">완료</span>' : ""}</b><button class="btn" style="width:auto;margin:0;padding:8px 14px;font-size:14px" data-fs="${i}">연습</button></div>
      <div class="list">${s.map(f => `<div class="it"><span><b>${esc(f.f)}</b> <span class="mu">[${esc(f.pr)}]</span><br><small class="mu">${esc(f.ex)}</small></span><span style="font-weight:800;text-align:right">${esc(f.ko)}</span></div>`).join("")}</div></div>`;
  });

    const s = sets[+b.dataset.fs]; const all = c.forms;

      const others = []; shuffle(all).forEach(x => { if (others.length < 3 && x.kq !== f.kq && x.f !== f.f && !others.some(o => o.kq === x.kq)) others.push(x) });
      if (i % 2 === 0) qs.push({ kind: "fko", ui: "mc", t: null, prompt: `<div class="row"><span class="big">${esc(f.f)}</span>${sndBtn(f.f.replace(/[\/\-]/g, " "))}</div><div class="qprompt" style="font-size:16px;color:var(--mu)">이 조각의 뜻은?</div>`, opts: shuffle([f, ...others]).map(x => ({ id: x.id, label: x.kq || x.ko })), ans: f.id, form: f });

    });
    startSession(qs, { type: "forms", key: c.no + "_" + b.dataset.fs });
  });
}

  h += ids.length ? `<div class="list">${ids.map(id => { const t = T[id], w = S.weak[id]; return `<div class="it"><span><b>${esc(t.en)}</b> ${sndBtn(t.en).replace('class="snd"', 'class="snd" style="width:30px;height:30px;vertical-align:middle"')}<br><small class="mu">${esc(t.kfull)} · ${t.ch}장</small></span><span style="text-align:right">${Object.keys(WEAK_NAME).filter(k => w[k]).map(k => `<span class="tg ${k}">${WEAK_NAME[k]} ${w[k]}</span>`).join("")}</span></div>` }).join("")}</div>` : `<p class="mu">아직 틀린 단어가 없어요.</p>`;

  $("#setReset").onclick = () => { sheet(`<h2>기록을 모두 지울까요?</h2><p class="mu">진도, 오답노트, 속도 기록이 사라져요. 되돌릴 수 없어요.</p><button class="btn red" id="rsY">지우기</button><button class="btn gh" id="rsN">취소</button>`); $("#rsN").onclick = closeSheet; $("#rsY").onclick = () => { try { localStorage.removeItem(KEY + "state") } catch (e) { } location.reload() } };
}

if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if (!S.goal) renderGoal(); else { renderHome(); show("home") }
</script>
